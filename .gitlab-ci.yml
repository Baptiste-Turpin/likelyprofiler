image: rocker/verse:latest

variables:
  R_LIBS_USER: "/usr/local/lib/R/site-library"

stages:
  - check
  - tests

before_script:
  - R -e 'devtools::install_deps(dependencies = TRUE)'

full_check:
  stage: check
  script:
    - |
      apt-get update && apt-get install -yq \
        texlive-fonts-recommended \
        tidy \
        libv8-dev
    - R -e 'install.packages(c("V8"), repos = "https://cloud.r-project.org")'
    - R CMD build .
    - R CMD check --as-cran likelyprofiler_*.tar.gz
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

light_check:
  stage: tests
  script:
    - Rscript -e 'devtools::test()'
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'